name: Deploy CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Deploy Staging job
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2202 -H 95.216.15.173 >> ~/.ssh/known_hosts

      - name: Deploy to Staging via Rsync
        run: |
          # A. Back up production database on server
          ssh -p 2202 fetfrum@95.216.15.173 "cp /home/fetfrum/Chinese2Anki/users.db /home/fetfrum/Chinese2Anki/users.db.bak_\$(date +%F_%H%M%S) || true"

          # B. Copy Production DB to Staging for testing (fresh data sync)
          ssh -p 2202 fetfrum@95.216.15.173 "cp /home/fetfrum/Chinese2Anki/users.db /home/fetfrum/Chinese2Anki-staging/users.db || true"

          # C. Sync source code to Staging directory (excluding DBs, node_modules, and config envs)
          rsync -ravz -e "ssh -p 2202" --exclude 'node_modules' --exclude '.git' --exclude '.github' --exclude 'users.db' --exclude 'sessions.db' --exclude '.env' ./ fetfrum@95.216.15.173:/home/fetfrum/Chinese2Anki-staging/

      # D. Generate Staging .env dynamically from GitHub Secrets & non-secret configs
      - name: Generate Staging .env
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ssh -p 2202 fetfrum@95.216.15.173 "cat << 'EOF' > /home/fetfrum/Chinese2Anki-staging/.env
          TTS_ENGINE=local
          AZURE_SPEECH_KEY=$AZURE_SPEECH_KEY
          AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION
          AZURE_SPEECH_RATE=-15%
          AZURE_SPEECH_PITCH=+5%
          AZURE_SPEECH_STYLE=assistant
          GEMINI_API_KEY=$GEMINI_API_KEY
          GEMINI_MODEL=gemini-2.0-flash
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          USE_ANTIGRAVITY=true
          DEFAULT_TOKENS=30
          COST_PER_ATTEMPT=10
          ADMIN_USER=$ADMIN_USER
          ADMIN_PASS_HASH=$ADMIN_PASS_HASH
          SESSION_SECRET=$SESSION_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          PORT=3001
          NODE_ENV=staging
          USE_HTTPS=false
          EOF"

      # E. Install node modules, run migrations, and restart Staging app
      - name: Build and Start Staging
        run: |
          ssh -p 2202 fetfrum@95.216.15.173 "cd /home/fetfrum/Chinese2Anki-staging && npm install --omit=dev && node src/migrations/migration_runner.js && pm2 restart chinese2anki-staging"

  # 2. Deploy Production job (Awaits manual approval in GitHub UI via Environment)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: Production
      url: https://chinese2anki.0fx.me
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2202 -H 95.216.15.173 >> ~/.ssh/known_hosts

      - name: Deploy to Production via Rsync
        run: |
          # A. Back up production database before deployment
          ssh -p 2202 fetfrum@95.216.15.173 "cp /home/fetfrum/Chinese2Anki/users.db /home/fetfrum/Chinese2Anki/users.db.pre_prod_\$(date +%F_%H%M%S)"

          # B. Sync source code to Production directory
          rsync -ravz -e "ssh -p 2202" --exclude 'node_modules' --exclude '.git' --exclude '.github' --exclude 'users.db' --exclude 'sessions.db' --exclude '.env' ./ fetfrum@95.216.15.173:/home/fetfrum/Chinese2Anki/

      # C. Generate Production .env dynamically from GitHub Secrets & non-secret configs
      - name: Generate Production .env
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ssh -p 2202 fetfrum@95.216.15.173 "cat << 'EOF' > /home/fetfrum/Chinese2Anki/.env
          TTS_ENGINE=local
          AZURE_SPEECH_KEY=$AZURE_SPEECH_KEY
          AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION
          AZURE_SPEECH_RATE=-15%
          AZURE_SPEECH_PITCH=+5%
          AZURE_SPEECH_STYLE=assistant
          GEMINI_API_KEY=$GEMINI_API_KEY
          GEMINI_MODEL=gemini-2.0-flash
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          USE_ANTIGRAVITY=true
          DEFAULT_TOKENS=30
          COST_PER_ATTEMPT=10
          ADMIN_USER=$ADMIN_USER
          ADMIN_PASS_HASH=$ADMIN_PASS_HASH
          SESSION_SECRET=$SESSION_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          PORT=3000
          NODE_ENV=production
          USE_HTTPS=false
          EOF"

      # D. Install node modules, run migrations, and restart Production app
      - name: Build and Start Production
        run: |
          ssh -p 2202 fetfrum@95.216.15.173 "cd /home/fetfrum/Chinese2Anki && npm install --omit=dev && node src/migrations/migration_runner.js && pm2 restart chinese2anki --update-env"
