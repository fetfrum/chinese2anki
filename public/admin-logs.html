<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи системи - Chinese2Anki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { width: 90%; max-width: 1400px; margin: 40px auto; padding: 0; }
        .admin-card { background: white; border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow-soft); }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab:hover:not(.active) { color: var(--text-main); }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
        .filter-input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
        .filter-input:focus { border-color: var(--primary); }
        .btn-filter { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-filter:hover { background: var(--primary-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; color: var(--text-muted); }
        .log-time { color: var(--text-muted); font-size: 0.85rem; }
        .session-id { font-family: monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .error-msg { color: #e53e3e; }
        
        .load-more { display: block; width: 100%; text-align: center; padding: 12px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: 500; color: var(--text-main); }
        .load-more:hover { background: #f1f5f9; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <a href="/" class="logo-section">
                <img src="logo_ci_1779933981137.png" alt="logo" style="border-radius: 8px;">
                <div class="logo-text">
                    <h1 style="color: var(--text-main);">Chinese2Anki</h1>
                    <p style="font-weight: 500;">Інтелектуальна система створення карток для вивчення китайської мови</p>
                </div>
            </a>
            <div class="nav-actions">
                <a href="/admin.html" style="color: var(--text-main); font-weight: 500; text-decoration: none; margin-right: 15px;">Користувачі</a>
                <a href="/" class="btn-primary" style="margin: 0; background: #e1e6eb; color: var(--text-main) !important; padding: 10px 20px; text-decoration: none;">Головна</a>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <h2 style="margin-bottom: 24px; color: var(--primary);">Логи системи</h2>
        
        <div class="admin-card">
            <div class="tabs">
                <div class="tab active" data-type="ACTION">Дії</div>
                <div class="tab" data-type="ERROR">Помилки</div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>ID Користувача</label>
                    <input type="number" id="filter-user" class="filter-input" placeholder="Наприклад, 1">
                </div>
                <div class="filter-group">
                    <label>UUID Сесії (можна частину)</label>
                    <input type="text" id="filter-session" class="filter-input" placeholder="Наприклад, abc12">
                </div>
                <button class="btn-filter" id="btn-apply-filter">Застосувати</button>
                <button class="btn-filter" id="btn-clear-filter" style="background:#e2e8f0;color:#1e293b;">Скинути</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Час</th>
                        <th style="width: 10%;">User ID</th>
                        <th style="width: 15%;">Session ID</th>
                        <th style="width: 60%;">Подія</th>
                    </tr>
                </thead>
                <tbody id="logs-table">
                    <tr><td colspan="4" style="text-align: center;">Завантаження...</td></tr>
                </tbody>
            </table>
            
            <button class="load-more" id="btn-load-more" style="display:none;">Завантажити ще</button>
        </div>
    </div>
    
    <script>
        let currentType = 'ACTION';
        let currentPage = 1;
        let hasMore = true;

        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/auth/status')
                .then(r => r.json())
                .then(data => {
                    if (!data.authenticated || data.user.is_admin !== 1) {
                        window.location.href = '/';
                        return;
                    }
                    loadLogs(true);
                });

            document.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                    e.target.classList.add('active');
                    currentType = e.target.getAttribute('data-type');
                    loadLogs(true);
                });
            });

            document.getElementById('btn-apply-filter').addEventListener('click', () => loadLogs(true));
            document.getElementById('btn-clear-filter').addEventListener('click', () => {
                document.getElementById('filter-user').value = '';
                document.getElementById('filter-session').value = '';
                loadLogs(true);
            });
            document.getElementById('btn-load-more').addEventListener('click', () => loadLogs(false));
        });

        function loadLogs(reset = false) {
            if (reset) {
                currentPage = 1;
                document.getElementById('logs-table').innerHTML = '';
            }

            const userId = document.getElementById('filter-user').value;
            const sessionId = document.getElementById('filter-session').value;
            
            let url = `/api/admin/logs?type=${currentType}&page=${currentPage}&limit=50`;
            if (userId) url += `&userId=${userId}`;
            if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;

            const loadBtn = document.getElementById('btn-load-more');
            loadBtn.innerText = 'Завантаження...';

            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('Failed to fetch');
                    return r.json();
                })
                .then(data => {
                    const tbody = document.getElementById('logs-table');
                    
                    if (data.data.length === 0 && reset) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">Записів не знайдено</td></tr>`;
                        loadBtn.style.display = 'none';
                        return;
                    }

                    let html = '';
                    data.data.forEach(l => {
                        const dateObj = new Date(l.created_at + 'Z'); // SQLite assumes UTC usually
                        const timeStr = dateObj.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second:'2-digit' });
                        
                        const shortSession = l.session_id ? l.session_id.split('-')[0] : '-';
                        const msgClass = currentType === 'ERROR' ? 'error-msg' : '';

                        html += `<tr>
                            <td class="log-time">${timeStr}</td>
                            <td>${l.user_id || '-'}</td>
                            <td>${l.session_id ? `<span class="session-id" title="${l.session_id}">${shortSession}</span>` : '-'}</td>
                            <td class="${msgClass}">${l.message}</td>
                        </tr>`;
                    });
                    
                    if (reset) {
                        tbody.innerHTML = html;
                    } else {
                        tbody.insertAdjacentHTML('beforeend', html);
                    }

                    if (currentPage >= data.totalPages) {
                        loadBtn.style.display = 'none';
                    } else {
                        loadBtn.style.display = 'block';
                        loadBtn.innerText = 'Завантажити ще';
                        currentPage++;
                    }
                })
                .catch(e => {
                    if (reset) {
                        document.getElementById('logs-table').innerHTML = `<tr><td colspan="4" style="text-align:center;color:red;">Помилка завантаження логів</td></tr>`;
                    }
                    loadBtn.style.display = 'none';
                });
        }
    </script>
</body>
</html>
