<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи системи - Chinese2Anki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { width: 90%; max-width: 1400px; margin: 40px auto; padding: 0; }
        .admin-card { background: white; border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow-soft); }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab:hover:not(.active) { color: var(--text-main); }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
        .filter-input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
        .filter-input:focus { border-color: var(--primary); }
        .btn-filter { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-filter:hover { background: var(--primary-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; color: var(--text-muted); }
        .log-time { color: var(--text-muted); font-size: 0.85rem; }
        .session-id { font-family: monospace; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .error-msg { color: #e53e3e; }
        
        .load-more { display: block; width: 100%; text-align: center; padding: 12px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: 500; color: var(--text-main); }
        .load-more:hover { background: #f1f5f9; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <a href="/" class="logo-section">
                <img src="logo_ci_1779933981137.png" alt="logo" style="border-radius: 8px;">
                <div class="logo-text">
                    <h1 style="color: var(--text-main);">Chinese2Anki</h1>
                    <p style="font-weight: 500;">Інтелектуальна система створення карток для вивчення китайської мови</p>
                </div>
            </a>
            <div class="nav-actions">
                <a href="/admin.html" style="color: var(--text-main); font-weight: 500; text-decoration: none; margin-right: 15px;">Користувачі</a>
                <a href="/" class="btn-primary" style="margin: 0; background: #e1e6eb; color: var(--text-main) !important; padding: 10px 20px; text-decoration: none;">Головна</a>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <h2 style="margin-bottom: 24px; color: var(--primary);">Логи системи</h2>
        
        <div class="admin-card">
            <div class="tabs">
                <div class="tab active" data-type="ACTION">Дії</div>
                <div class="tab" data-type="ERROR">Помилки</div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>ID Користувача</label>
                    <input type="number" id="filter-user" class="filter-input" placeholder="Наприклад, 1">
                </div>
                <div class="filter-group">
                    <label>UUID Сесії (можна частину)</label>
                    <input type="text" id="filter-session" class="filter-input" placeholder="Наприклад, abc12">
                </div>
                <button class="btn-filter" id="btn-apply-filter">Застосувати</button>
                <button class="btn-filter" id="btn-clear-filter" style="background:#e2e8f0;color:#1e293b;">Скинути</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Час</th>
                        <th style="width: 10%;">User ID</th>
                        <th style="width: 15%;">Session ID</th>
                        <th style="width: 60%;">Подія</th>
                    </tr>
                </thead>
                <tbody id="logs-table">
                    <tr><td colspan="4" style="text-align: center;">Завантаження...</td></tr>
                </tbody>
            </table>
            
            <button class="load-more" id="btn-load-more" style="display:none;">Завантажити ще</button>
        </div>
    </div>
    
    <script src="/admin-logs.js"></script>
</body>
</html>
